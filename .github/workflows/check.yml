name: Zweig prüfen

# Baut jeden Arbeitszweig zur Kontrolle, ohne die Download-Version
# (Release „latest“) anzufassen. Die APK liegt nur als Artefakt am Lauf.
on:
  push:
    branches-ignore: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle-Cache vorbereiten
        uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: ./gradlew assembleDebug --no-daemon

      - name: APK als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: breadcrumbz-zweig-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
